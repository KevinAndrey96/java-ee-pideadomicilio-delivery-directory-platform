name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: Build & Test (Java 8 Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Unit Tests
        run: mvn test -DskipSass=true -B

      - name: Package WAR Artifact
        run: mvn package -DskipTests -DskipSass=true -B

      - name: Verify Artifact Existence
        run: |
          test -f target/ROOT.war && echo "WAR artifact verified: target/ROOT.war"

  verification-suite:
    name: Platform Architecture Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Verification Suite
        run: python scripts/verify_pideadomicilio.py

  docker-syntax:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: docker compose config
