services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pideadomicilio-web
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9990:9990"
    environment:
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - FILE_STORAGE_PATH=/opt/filespad
      - AES_SECRET_KEY=Inf12345Inf12345
      - AES_INIT_VECTOR=RandomInftVector
    volumes:
      - uploads_data:/opt/filespad
    depends_on:
      - mongo
    networks:
      - delivery_net

  mongo:
    image: mongo:4.4
    container_name: pideadomicilio-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=pedidosadomicilio
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - delivery_net

  mongo-express:
    image: mongo-express:1.0.2
    container_name: pideadomicilio-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
    depends_on:
      - mongo
    networks:
      - delivery_net

volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local

networks:
  delivery_net:
    driver: bridge
